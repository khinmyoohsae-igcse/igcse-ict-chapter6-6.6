<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGCSE ICT - Banking Systems & Banking Applications Quiz (20 MCQs)</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #131d31;
            --border-color: #223354;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        header h1 {
            color: var(--accent);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-status {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .score-pill {
            background-color: #0c4a6e;
            color: #7dd3fc;
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #0284c7;
        }

        .card {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            background-color: #1e293b;
            color: var(--text-main);
            padding: 1rem 1.25rem;
            border-radius: 0.85rem;
            border: 1px solid #334155;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #283548;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #064e3b !important;
            border-color: #059669 !important;
            color: #ecfdf5 !important;
        }

        .option-btn.incorrect {
            background-color: #7f1d1d !important;
            border-color: #dc2626 !important;
            color: #fee2e2 !important;
        }

        .feedback-box {
            padding: 1.15rem;
            border-radius: 0.85rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback-box.correct-feedback {
            background-color: #022c22;
            border: 1px solid #047857;
            color: #a7f3d0;
        }

        .feedback-box.incorrect-feedback {
            background-color: #450a0a;
            border: 1px solid #b91c1c;
            color: #fecdd3;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 700;
            padding: 0.85rem 1.75rem;
            border-radius: 0.85rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .results-card {
            text-align: center;
            padding: 3rem 2rem;
        }

        .results-card h2 {
            font-size: 2.25rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .results-card p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .hidden {
            display: none !important;
        }

        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>IGCSE ICT Practice Quiz</h1>
        <p>Topics 6.6 & 6.6.1 Banking Systems & Banking Applications (20 MCQs)</p>
    </header>

    <main>
        <div class="quiz-status">
            <span id="question-counter">Question 1 of 20</span>
            <span id="score-display" class="score-pill">Score: 0</span>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="card">
            <div id="question-box" class="question-text">
                Loading question...
            </div>

            <div id="options-container" class="options-list">
                <!-- Options populated dynamically -->
            </div>

            <div id="feedback-box" class="feedback-box hidden">
                <!-- Feedback populated dynamically -->
            </div>

            <div style="display: flex; justify-content: flex-end;">
                <button id="next-btn" onclick="nextQuestion()" class="btn-primary hidden">Next Question</button>
            </div>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="card results-card hidden">
            <h2>Quiz Completed! 🎉</h2>
            <p id="final-score">You scored X out of 20</p>
            <button onclick="restartQuiz()" class="btn-primary">Restart Quiz</button>
        </div>
    </main>

    <footer>
        IGCSE ICT Revision &bull; Banking Systems
    </footer>

    <script>
        const questions = [
            {
                question: "What is an Automated Teller Machine (ATM) used for in banking systems?",
                options: [
                    { text: "A computerized self-service machine that allows bank customers to withdraw cash, check account balances, and deposit funds 24/7", isCorrect: true, rationale: "ATMs provide automated self-service banking transactions around the clock." },
                    { text: "A machine used for printing paper books and magazines", isCorrect: false, rationale: "This describes publishing printers." },
                    { text: "A computer hardware router for connecting LAN networks", isCorrect: false, rationale: "This describes network routing hardware." },
                    { text: "An optical mark reader for grading multiple-choice exam sheets", isCorrect: false, rationale: "This describes OMR exam grading." }
                ]
            },
            {
                question: "What input and output technologies are built into a standard ATM machine?",
                options: [
                    { text: "Keypad and card reader (inputs); screen display, cash dispenser, receipt printer, and loudspeaker (outputs)", isCorrect: true, rationale: "ATMs combine input peripherals (keypad, card slot) with output peripherals (screen, cash dispenser, printer)." },
                    { text: "Laser printers and flatbed scanners only", isCorrect: false, rationale: "ATMs dispense cash and process card chips, unlike standard office scanners." },
                    { text: "Barcode scanners and 3D plotting machines", isCorrect: false, rationale: "These are unrelated industrial/retail peripherals." },
                    { text: "Magnetic tape reels and punch card readers", isCorrect: false, rationale: "These are legacy 1960s computing technologies." }
                ]
            },
            {
                question: "How does a bank customer authenticate their identity when using an ATM?",
                options: [
                    { text: "By inserting a chip-and-PIN bank card and entering a secret Personal Identification Number (PIN) via the secure keypad", isCorrect: true, rationale: "Chip-and-PIN authentication verifies the cardholder's identity securely at ATMs." },
                    { text: "By scanning supermarket barcodes using a hand scanner", isCorrect: false, rationale: "Barcodes are used in retail, not ATM banking." },
                    { text: "By speaking their bank account password out loud into the room", isCorrect: false, rationale: "Passwords must be entered privately via keypad, never spoken aloud." },
                    { text: "By mailing a handwritten paper letter to the bank manager", isCorrect: false, rationale: "ATMs provide instant electronic authentication." }
                ]
            },
            {
                question: "What is Internet Banking (Online Banking)?",
                options: [
                    { text: "A service provided by banks that enables customers to conduct financial transactions and manage accounts securely over the internet via a web browser or mobile app", isCorrect: true, rationale: "Internet banking allows customers to check balances, transfer funds, and pay bills online 24/7." },
                    { text: "A physical telephone landline used for calling customer support", isCorrect: false, rationale: "This describes telephone banking, not web-based online banking." },
                    { text: "An offline spreadsheet application saved on a local hard drive", isCorrect: false, rationale: "This describes desktop spreadsheet software." },
                    { text: "A computer virus protection program", isCorrect: false, rationale: "This describes anti-malware software." }
                ]
            },
            {
                question: "What is Mobile Banking (Mobile App Banking)?",
                options: [
                    { text: "Banking services accessed via specialized mobile applications installed on smartphones or tablets using mobile data or Wi-Fi", isCorrect: true, rationale: "Mobile banking apps provide convenient on-the-go account management and instant payment transfers." },
                    { text: "Banking inside a moving train carriage using paper logbooks", isCorrect: false, rationale: "Mobile banking uses smartphone applications over cellular networks." },
                    { text: "Using automated teller machines installed inside public buses", isCorrect: false, rationale: "ATMs are fixed bank terminals, not bus installations." },
                    { text: "Sending paper checks through postal mail services", isCorrect: false, rationale: "This is traditional mail banking." }
                ]
            },
            {
                question: "What is Electronic Fund Transfer (EFT)?",
                options: [
                    { text: "The electronic transfer of money from one bank account to another, either within the same bank or across different financial institutions", isCorrect: true, rationale: "EFT automates money transfers digitally without requiring physical cash or paper checks." },
                    { text: "The physical transportation of paper banknotes in armored security trucks", isCorrect: false, rationale: "Armored trucks transport physical cash, whereas EFT is purely electronic." },
                    { text: "Printing paper bank statements on laser printers", isCorrect: false, rationale: "This describes statement printing." },
                    { text: "Scanning checks using an optical character reader", isCorrect: false, rationale: "This is check processing." }
                ]
            },
            {
                question: "What is a Standing Order in banking systems?",
                options: [
                    { text: "An instruction given by a bank customer to pay a fixed amount of money to a specific recipient at regular intervals automatically", isCorrect: true, rationale: "Standing orders automate regular fixed payments like rent or club subscriptions." },
                    { text: "An instruction telling customers to stand up inside bank branches", isCorrect: false, rationale: "Standing orders are automated financial payment instructions." },
                    { text: "A request to freeze bank accounts permanently", isCorrect: false, rationale: "This is an account freeze." },
                    { text: "An order for office stationery supplies", isCorrect: false, rationale: "This is office administration." }
                ]
            },
            {
                question: "What is a Direct Debit in banking systems?",
                options: [
                    { text: "An instruction to a bank allowing a third-party organization to withdraw variable amounts of money from an account when payments are due", isCorrect: true, rationale: "Direct debits automate variable bill payments (like utility or phone bills) where amounts change monthly." },
                    { text: "A debit card used for buying groceries directly at supermarket tills", isCorrect: false, rationale: "This describes point-of-sale debit card purchases, not direct debit billing instructions." },
                    { text: "A physical cash withdrawal made at an ATM", isCorrect: false, rationale: "This is cash withdrawal." },
                    { text: "A fixed monthly transfer amount", isCorrect: true.split()[0] === 'false' && true, rationale: "Fixed amounts describe standing orders; direct debits handle variable amounts." }
                ]
            },
            {
                question: "What security measures do banks use to protect online banking customers against fraud and unauthorized access?",
                options: [
                    { text: "Two-Factor Authentication (2FA), OTP (One-Time Passcodes sent via SMS), encrypted HTTPS sessions, and biometric login", isCorrect: true, rationale: "Multi-layered security protocols protect online bank accounts from cybercriminals and unauthorized logins." },
                    { text: "Leaving customer account passwords written on public sticky notes", isCorrect: false, rationale: "This is an extreme security violation." },
                    { text: "Using unencrypted HTTP web connections", isCorrect: false, rationale: "Unencrypted connections expose financial data to hackers." },
                    { text: "Requiring customers to mail paper signatures for every web click", isCorrect: false, rationale: "Online banking relies on digital authentication." }
                ]
            },
            {
                question: "What are the advantages of online and mobile banking for customers?",
                options: [
                    { text: "Available 24/7 from anywhere, instant fund transfers, ability to check balances and statements immediately, and avoiding physical bank branch queues", isCorrect: true, rationale: "Digital banking offers immense convenience, round-the-clock access, and instant transaction management." },
                    { text: "Absolute immunity to computer hacking or cyber fraud", isCorrect: false, rationale: "Digital platforms face cybersecurity risks and require vigilance." },
                    { text: "Requirement to visit physical bank branches for every simple transaction", isCorrect: false, rationale: "Online banking eliminates physical branch visits for routine tasks." },
                    { text: "Free physical cash printing inside home computers", isCorrect: false, rationale: "This is impossible." }
                ]
            },
            {
                question: "What are the advantages of online and mobile banking for banks (financial institutions)?",
                options: [
                    { text: "Reduced operational costs by needing fewer physical branches and staff, 24/7 global customer service availability, and automated transaction processing", isCorrect: true, rationale: "Digital banking lowers overhead operating costs for banks while scaling service capacity globally." },
                    { text: "Complete elimination of all computer servers and IT infrastructure", isCorrect: false, rationale: "Banks rely heavily on massive, secure IT server infrastructures." },
                    { text: "Requirement to hire 100,000 additional manual phone operators", isCorrect: false, rationale: "Automation reduces the need for large manual phone centers." },
                    { text: "Zero liability for customer data security", isCorrect: false, rationale: "Banks carry strict regulatory accountability for data protection." }
                ]
            },
            {
                question: "What is a disadvantage or risk associated with online and mobile banking?",
                options: [
                    { text: "Vulnerability to phishing scams, cyberattacks, malware, internet connection dependency, and potential identity theft", isCorrect: true, rationale: "Digital banking exposes users to online fraud, phishing attacks, and technical outages." },
                    { text: "Physical heavy weight of mobile banking apps on smartphones", isCorrect: false, rationale: "Apps are lightweight software data packages." },
                    { text: "Inability to transfer funds outside local post office hours", isCorrect: false, rationale: "Online banking operates 24/7/365." },
                    { text: "Mandatory requirement to pay cash fees for viewing account balances", isCorrect: false, rationale: "Account checking is typically free." }
                ]
            },
            {
                question: "What is chip-and-PIN technology used in bank debit and credit cards?",
                options: [
                    { text: "An embedded microprocessor chip on the card that stores encrypted authentication data, verified by entering a 4-digit PIN", isCorrect: true, rationale: "Chip-and-PIN replaced signature-based magnetic stripe cards to drastically reduce card fraud." },
                    { text: "A mechanical key used for unlocking bank front doors", isCorrect: false, rationale: "This describes building door locks." },
                    { text: "A paper ticket printed at ATM terminals", isCorrect: false, rationale: "This describes ATM receipts." },
                    { text: "A magnetic storage tape reel", isCorrect: false, rationale: "This is legacy storage." }
                ]
            },
            {
                question: "What is contactless payment technology (RFID / NFC) in modern bank cards and smartphones?",
                options: [
                    { text: "A short-range wireless technology that allows customers to pay for items by tapping their card or phone near a payment terminal without entering a PIN for small amounts", isCorrect: true, rationale: "Contactless NFC/RFID chips enable fast tap-and-go retail payments." },
                    { text: "A global satellite tracking system spanning across continents", isCorrect: false, rationale: "This describes GPS navigation." },
                    { text: "A wired Ethernet cable plugged into card readers", isCorrect: false, rationale: "Contactless is strictly wireless." },
                    { text: "An optical barcode scanner used at checkout tills", isCorrect: false, rationale: "This describes barcode scanning." }
                ]
            },
            {
                question: "What is MICR (Magnetic Ink Character Recognition) and how is it used in banking check processing?",
                options: [
                    { text: "A technology that reads characters printed with magnetic ink (such as bank routing and account numbers at the bottom of checks) for rapid, automated check clearing", isCorrect: true, rationale: "MICR allows high-speed, automated processing of paper checks even if stamped or folded." },
                    { text: "A color inkjet printer used for printing family holiday photos", isCorrect: false, rationale: "This describes domestic photo printing." },
                    { text: "An optical mark reader used for grading multiple-choice exam papers", isCorrect: false, rationale: "This describes OMR card grading." },
                    { text: "A barcode scanner used in supermarket checkout lanes", isCorrect: false, rationale: "This is retail POS." }
                ]
            },
            {
                question: "Why is MICR preferred over standard optical character recognition (OCR) for processing paper checks?",
                options: [
                    { text: "MICR characters can be read accurately even if they are covered by stamps, signatures, or stray marks, whereas OCR requires clear optical visibility", isCorrect: true, rationale: "Magnetic ink data remains readable by MICR heads despite physical contamination or over-stamping on checks." },
                    { text: "MICR prints checks in glowing neon colors", isCorrect: false, rationale: "Color has no bearing on magnetic ink recognition." },
                    { text: "MICR eliminates the need for bank accounts", isCorrect: false, rationale: "Bank accounts are essential for check clearing." },
                    { text: "MICR is a wireless Bluetooth communication protocol", isCorrect: false, rationale: "MICR is a reading technology for magnetic ink characters." }
                ]
            },
            {
                question: "What is Batch Processing in the context of bank transaction clearing?",
                options: [
                    { text: "Collecting and grouping bank transactions together over a period (e.g., overnight) and processing them all at once as a single batch", isCorrect: true, rationale: "Batch processing handles high-volume bank clearing operations (like check clearance or direct debits) overnight without requiring immediate real-time execution." },
                    { text: "Processing each individual customer transaction instantly the exact second it occurs", isCorrect: false, rationale: "This describes real-time processing, not batch processing." },
                    { text: "Printing paper bank statements one line at a time manually", isCorrect: false, rationale: "This is manual printing." },
                    { text: "Scanning supermarket barcodes at checkout tills", isCorrect: false, rationale: "This is retail POS." }
                ]
            },
            {
                question: "What is Real-Time Processing in banking systems?",
                options: [
                    { text: "Processing transactions immediately as they occur so account balances update instantly (e.g., ATM cash withdrawals or online fund transfers)", isCorrect: true, rationale: "Real-time processing updates account balances immediately, preventing overdrawing." },
                    { text: "Processing accumulated bank records once a week over weekends", isCorrect: false, rationale: "This describes batch processing." },
                    { text: "Mailing paper bank statements via postal services once a year", isCorrect: false, rationale: "This is annual postal reporting." },
                    { text: "Storing backup files on magnetic tape vaults", isCorrect: false, rationale: "This is tape archiving." }
                ]
            },
            {
                question: "What is biometric authentication in modern mobile banking apps?",
                options: [
                    { text: "Using unique biological characteristics—such as fingerprint scanning or facial recognition—to verify the customer's identity and log into banking apps", isCorrect: true, rationale: "Biometrics provide secure, convenient login authentication without requiring passwords to be typed." },
                    { text: "Measuring room temperature inside bank branch offices", isCorrect: false, rationale: "Temperature sensing is environmental climate control." },
                    { text: "Scanning printed paper bank statements", isCorrect: false, rationale: "This is document scanning." },
                    { text: "Checking tire air pressure on bank delivery vans", isCorrect: false, rationale: "This is vehicle transport monitoring." }
                ]
            },
            {
                question: "Which summary best encapsulates 6.6 / 6.6.1 Banking Systems and Banking Applications in IGCSE ICT?",
                options: [
                    { text: "Banking systems utilize ATMs, internet/mobile banking, EFT, MICR check processing, and batch/real-time transactions to deliver secure, automated financial services 24/7 while relying on robust cybersecurity and encryption", isCorrect: true, rationale: "Banking systems integrate self-service ATMs, digital online channels, automated MICR clearing, and secure transaction processing." },
                    { text: "Banking systems are manual paper ledger books used exclusively by medieval bank clerks", isCorrect: false, rationale: "Modern banking systems are fully computerized and digital." },
                    { text: "Banking systems require no database security or transaction verification", isCorrect: false, rationale: "Security and verification are foundational to banking." },
                    { text: "Banking systems are identical to offline video game consoles", isCorrect: false, rationale: "Banking systems handle financial transactions, not gaming." }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");
        const questionBox = document.getElementById("question-box");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");
        const quizContainer = document.getElementById("quiz-container");
        const resultsContainer = document.getElementById("results-container");
        const finalScore = document.getElementById("final-score");

        function loadQuestion() {
            answered = false;
            feedbackBox.classList.add("hidden");
            nextBtn.classList.add("hidden");
            
            const q = questions[currentQuestionIndex];
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            scoreDisplay.textContent = `Score: ${score}`;
            questionBox.textContent = q.question;

            // Shuffle options array randomly so correct answer is not always first
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = "";
            shuffledOptions.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(opt, shuffledOptions);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedOpt, shuffledOptions) {
            if (answered) return;
            answered = true;

            const allOptionButtons = optionsContainer.children;

            shuffledOptions.forEach((opt, idx) => {
                allOptionButtons[idx].disabled = true;
                if (opt.isCorrect) {
                    allOptionButtons[idx].classList.add("correct");
                } else if (opt === selectedOpt && !selectedOpt.isCorrect) {
                    allOptionButtons[idx].classList.add("incorrect");
                }
            });

            feedbackBox.classList.remove("hidden");
            if (selectedOpt.isCorrect) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                feedbackBox.className = "feedback-box correct-feedback";
                feedbackBox.innerHTML = `<strong>Correct!</strong> ${selectedOpt.rationale}`;
            } else {
                feedbackBox.className = "feedback-box incorrect-feedback";
                feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${selectedOpt.rationale}`;
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.textContent = "Next Question";
            } else {
                nextBtn.textContent = "View Results";
            }
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                quizContainer.classList.add("hidden");
                resultsContainer.classList.remove("hidden");
                finalScore.textContent = `You scored ${score} out of ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultsContainer.classList.add("hidden");
            quizContainer.classList.remove("hidden");
            loadQuestion();
        }

        // Initialize quiz on load
        loadQuestion();
    </script>
</body>
</html>
